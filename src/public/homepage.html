<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Postal Service</title>
</head>
<body>
    <h2>All Packages</h2>
  <table id="packageTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Sender</th>
        <th>Receiver</th>
        <th>Sender Address</th>
        <th>Receiver Address</th>
        <th>Weight</th>
        <th>Cost/Weight</th>
        <th>Flat Fee</th>
        <th>Shipping Method</th>
        <th>Tracking #</th>
        <th>Created</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      
    </tbody>
  </table>

  <a href="index.html">
    <button>Add Packages</button>
  </a>
  <a href="update.html">
    <button>Update Status</button>
  </a>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
  fetch("http://localhost:3000/api/packages")
    .then(response => response.json())
    .then(data => {
      const tableBody = document.querySelector("#packageTable tbody");
      tableBody.innerHTML = ""; 

      data.forEach(pkg => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${pkg.id}</td>
          <td>${pkg.sendername}</td>
          <td>${pkg.receivername}</td>
          <td>${pkg.senderaddress}</td>
          <td>${pkg.receiveraddress}</td>
          <td>${pkg.weight}</td>
          <td>${pkg.costperweight}</td>
          <td>${pkg.flatfee ?? "N/A"}</td>
          <td>${pkg.shippingmethod}</td>
          <td>${pkg.trackingnumber}</td>
          <td>${new Date(pkg.createdat).toLocaleString()}</td>
            <td>${pkg.status}</td>
        `;
        tableBody.appendChild(row);
      });
    })
    .catch(error => {
      console.error("Error fetching packages:", error);
      alert("Failed to load package data.");
    });
});
    </script>
</body>
</html>

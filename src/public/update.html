<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Update Package Status</h2>
    <form id="updateStatusForm">
      <label for="trackingNumber">Tracking Number:</label>
      <input type="text" id="trackingNumber" name="trackingNumber" required />
    
      <label for="status">Select New Status:</label>
      <select id="status" name="status" required>
        <option value="">--Select Status--</option>
        <option value="Pending">Pending</option>
        <option value="In-Transit">In-Transit</option>
        <option value="Delivered">Delivered</option>
      </select>
    
      <button type="submit">Update Status</button>
    </form>
    
    <script >
        document.getElementById("updateStatusForm").addEventListener("submit", function (event) {
  event.preventDefault();

  const trackingNumber = document.getElementById("trackingNumber").value;
  const status = document.getElementById("status").value;

  fetch(`http://localhost:3000/api/packages/${trackingNumber}/status`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ status }),
  })
    .then((response) => response.json())
    .then((data) => {
      alert("Package status updated successfully!");
      window.location.href = "homepage.html"; // Redirect to homepage
    })
    .catch((error) => {
      console.error("Error:", error);
      alert("Failed to update status.");
    });
});

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css" />
  <title>Package Shipping System</title>
</head>
<body>
  <!-- One-Day Package Form -->
  <h2>One-Day Package</h2>
  <form id="oneDayForm" class="form">
    <label>Sender Name:</label>
    <input type="text" id="oneSender" required />

    <label>Receiver Name:</label>
    <input type="text" id="oneReceiver" required />

    <label>Sender Address:</label>
    <input type="text" id="oneSenderAddress" required />

    <label>Receiver Address:</label>
    <input type="text" id="oneReceiverAddress" required />

    <label>Weight (kg):</label>
    <input type="number" id="oneWeight" step="0.01" required />

    <label>Cost per Weight ($):</label>
    <input type="number" id="oneCostPerWeight" step="0.01" required />

    <label>Flat Fee ($):</label>
    <input type="number" id="oneFlatFee" step="0.01" />

    <button type="submit">Send One-Day Package</button>
  </form>

  <hr>

  <!-- Two-Day Package Form -->
  <h2>Two-Day Package</h2>
  <form id="twoDayForm" class="form">
    <label>Sender Name:</label>
    <input type="text" id="twoSender" required />

    <label>Receiver Name:</label>
    <input type="text" id="twoReceiver" required />

    <label>Sender Address:</label>
    <input type="text" id="twoSenderAddress" required />

    <label>Receiver Address:</label>
    <input type="text" id="twoReceiverAddress" required />

    <label>Weight (kg):</label>
    <input type="number" id="twoWeight" step="0.01" required />

    <label>Cost per Weight ($):</label>
    <input type="number" id="twoCostPerWeight" step="0.01" required />

    <label>Flat Fee ($):</label>
    <input type="number" id="twoFlatFee" step="0.01" />

    <button type="submit">Send Two-Day Package</button>
  </form>

  <script src="index.js"></script>
</body>
</html>
